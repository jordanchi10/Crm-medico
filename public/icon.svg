<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.3" flood-color="#042f2e"/>
    </filter>
  </defs>

  <!-- Background rounded rect with safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Inner glow & subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Center Stethoscope Badge -->
  <g filter="url(#shadow)">
    <!-- Red glowing icon container -->
    <rect x="128" y="104" width="256" height="256" rx="64" fill="url(#badgeGrad)"/>
    <rect x="130" y="106" width="252" height="252" rx="62" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>
    
    <!-- Stethoscope lines (White) -->
    <path d="M200 176v48c0 31 25 56 56 56s56-25 56-56v-48" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M256 280v36a32 32 0 0 0 32 32h16a32 32 0 0 1 32 32v12" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="336" cy="392" r="18" fill="#ffffff"/>
    <circle cx="200" cy="168" r="10" fill="#ffffff"/>
    <circle cx="312" cy="168" r="10" fill="#ffffff"/>
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="1">
    MedCRM
  </text>
  <text x="256" y="462" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#ccfbf1" letter-spacing="2">
    ECUADOR 🇪🇨
  </text>
</svg>
